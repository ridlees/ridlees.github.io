name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"

            - run: go version

            - name: Setup Hugo v0.148.2+extended+withdeploy and Dart Sass
              run: |
                  HUGO_VERSION="0.148.2"
                  curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
                  sudo tar -xzf hugo.tar.gz -C /usr/local/bin hugo
                  rm hugo.tar.gz
                  
                  # Install Dart Sass via npm to prevent snapd hangs
                  sudo npm install -g sass
                  
                  hugo version
                  sass --version

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
